[project]
name = "qiluvision-media-service"
version = "0.1.0"
description = "FFmpeg preprocessing service for QiluVision"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pillow>=11.0,<13.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.9,<1.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
